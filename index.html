<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Air 2024 Simulation</title>
    <style>
        /* ... (всі стилі залишаються без змін) ... */
    </style>
</head>
<body>

    <!-- ... (HTML структура залишається без змін) ... -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let folderCounter = 1;
            let fileCounter = 1;
            let selectedItem = null;
            let isDragging = false;
            let dragOffset = { x: 0, y: 0 };
            let folders = {};
            let files = {};
            let currentProject = null;
            let openTabs = [];
            let activeTab = null;

            // Шаблони файлів
            const fileTemplates = {
                html: `<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новий документ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Привіт, світ!</h1>
    <p>Це новий HTML документ</p>
    <script src="script.js"><\/script>
</body>
</html>`,
                css: `/* Стилі для нового проекту */
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

h1 {
    text-align: center;
    font-size: 3em;
    margin-bottom: 20px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
}`,
                js: `// JavaScript код
console.log('Привіт від macOS!');

function welcomeMessage() {
    const now = new Date();
    alert('Ласкаво просимо! Сьогодні: ' + now.toLocaleDateString('uk-UA'));
}

// Викликаємо функцію при завантаженні
document.addEventListener('DOMContentLoaded', welcomeMessage);

// Приклад класу
class Greeter {
    constructor(name) {
        this.name = name;
    }
    
    greet() {
        return 'Привіт, ' + this.name + '!';
    }
}

const greeter = new Greeter('Користувач');
console.log(greeter.greet());`
            };

            /* -----------------------------
               1. ОНОВЛЕННЯ ЧАСУ В MENUBAR
            ------------------------------ */
            const dateTimeElement = document.querySelector('.date-time');

            function updateDateTime() {
                const now = new Date();
                const options = {
                    hour: '2-digit',
                    minute: '2-digit',
                    weekday: 'short',
                    day: 'numeric',
                    month: 'short'
                };
                const formattedDate = now
                    .toLocaleDateString('uk-UA', options)
                    .replace(',', '');
                if (dateTimeElement) {
                    dateTimeElement.textContent = formattedDate;
                }
            }

            updateDateTime();
            setInterval(updateDateTime, 60000);

            /* -----------------------------
               2. ЕФЕКТ "СТРИБКА" В DOCK
            ------------------------------ */
            const dockItems = document.querySelectorAll('.dock-item');

            dockItems.forEach((item) => {
                item.addEventListener('mouseenter', () => {
                    item.classList.add('active');
                    const prev = item.previousElementSibling;
                    const next = item.nextElementSibling;
                    if (prev) prev.classList.add('nearby');
                    if (next) next.classList.add('nearby');
                });

                item.addEventListener('mouseleave', () => {
                    item.classList.remove('active');
                    const prev = item.previousElementSibling;
                    const next = item.nextElementSibling;
                    if (prev) prev.classList.remove('nearby');
                    if (next) next.classList.remove('nearby');
                });
            });

            /* -----------------------------
               3. УПРАВЛІННЯ ВІКНАМИ
            ------------------------------ */
            const windows = {
                finderWindow: document.getElementById('finderWindow'),
                safariWindow: document.getElementById('safariWindow'),
                mailWindow: document.getElementById('mailWindow'),
                settingsWindow: document.getElementById('settingsWindow'),
                codeEditorWindow: document.getElementById('codeEditorWindow')
            };

            // Функція закриття вікон
            function closeWindow(windowId) {
                if (windows[windowId]) {
                    windows[windowId].style.display = 'none';
                    // Видаляємо активну точку з Dock
                    const appName = windowId.replace('Window', '');
                    const dockItem = document.querySelector(`.dock-item[data-name="${appName.charAt(0).toUpperCase() + appName.slice(1)}"]`);
                    if (dockItem) {
                        dockItem.querySelector('.dot').classList.remove('active');
                    }
                }
            }

            // Додаємо обробники закриття для всіх вікон
            document.querySelectorAll('.window-control.close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const windowId = e.target.getAttribute('data-window');
                    closeWindow(windowId);
                });
            });

            // Відкриття додатків з Dock
            document.querySelector('.dock-item[data-name="Finder"]').addEventListener('click', () => openApp('finderWindow', 'Finder'));
            document.querySelector('.dock-item[data-name="Safari"]').addEventListener('click', () => openApp('safariWindow', 'Safari'));
            document.querySelector('.dock-item[data-name="Mail"]').addEventListener('click', () => openApp('mailWindow', 'Mail'));
            document.querySelector('.dock-item[data-name="Settings"]').addEventListener('click', () => openApp('settingsWindow', 'Settings'));
            document.querySelector('.dock-item[data-name="Code Editor"]').addEventListener('click', () => openApp('codeEditorWindow', 'Code Editor'));

            // Відкриття Files з робочого столу
            document.querySelector('.desktop-icon[data-name="Files"]').addEventListener('click', () => openApp('finderWindow', 'Finder'));

            function openApp(windowId, appName) {
                if (windows[windowId]) {
                    windows[windowId].style.display = 'flex';
                    // Додаємо активну точку в Dock
                    const dockItem = document.querySelector(`.dock-item[data-name="${appName}"]`);
                    if (dockItem) {
                        dockItem.querySelector('.dot').classList.add('active');
                    }
                }
            }

            /* -----------------------------
               4. СТВОРЕННЯ ПАПОК ТА ФАЙЛІВ
            ------------------------------ */
            const filesGrid = document.getElementById('filesGrid');
            const newFolderBtn = document.getElementById('newFolderBtn');
            const newFileBtn = document.getElementById('newFileBtn');
            const deleteFolderBtn = document.getElementById('deleteFolderBtn');
            const nameModal = document.getElementById('nameModal');
            const itemNameInput = document.getElementById('itemNameInput');
            const fileTypeSelect = document.getElementById('fileTypeSelect');
            const modalTitle = document.getElementById('modalTitle');
            const cancelNameBtn = document.getElementById('cancelNameBtn');
            const confirmNameBtn = document.getElementById('confirmNameBtn');

            let currentModalType = 'folder'; // 'folder' або 'file'

            function showNameModal(type = 'folder') {
                currentModalType = type;
                
                if (type === 'folder') {
                    modalTitle.textContent = 'Введіть назву папки';
                    itemNameInput.value = `Нова папка ${folderCounter}`;
                    fileTypeSelect.style.display = 'none';
                } else {
                    modalTitle.textContent = 'Введіть назву файлу';
                    itemNameInput.value = `новий файл ${fileCounter}`;
                    fileTypeSelect.style.display = 'block';
                }
                
                nameModal.style.display = 'flex';
                itemNameInput.focus();
                itemNameInput.select();
            }

            function createNewFolder(name) {
                const folderId = 'folder_' + Date.now();
                
                const folderElement = document.createElement('div');
                folderElement.className = 'file-item';
                folderElement.setAttribute('data-type', 'folder');
                folderElement.setAttribute('data-id', folderId);
                folderElement.innerHTML = `
                    <div class="file-icon folder-icon"></div>
                    <div class="file-name">${name}</div>
                `;

                // Зберігаємо інформацію про папку
                folders[folderId] = {
                    id: folderId,
                    name: name,
                    element: folderElement,
                    files: [],
                    type: 'folder'
                };

                // Додаємо обробники подій для нової папки
                addItemEventListeners(folderElement, folderId, 'folder');

                filesGrid.appendChild(folderElement);
                folderCounter++;
            }

            function createNewFile(name, type = 'html') {
                const fileId = 'file_' + Date.now();
                const extension = type === 'html' ? '.html' : type === 'css' ? '.css' : '.js';
                const fullName = name.endsWith(extension) ? name : name + extension;
                
                const fileElement = document.createElement('div');
                fileElement.className = 'file-item';
                fileElement.setAttribute('data-type', 'file');
                fileElement.setAttribute('data-id', fileId);
                fileElement.innerHTML = `
                    <div class="file-icon ${type}-file"></div>
                    <div class="file-name">${fullName}</div>
                `;

                // Зберігаємо інформацію про файл
                files[fileId] = {
                    id: fileId,
                    name: fullName,
                    element: fileElement,
                    type: type,
                    content: fileTemplates[type],
                    folder: currentProject
                };

                // Додаємо файл до папки
                if (currentProject && folders[currentProject]) {
                    folders[currentProject].files.push(fileId);
                }

                // Додаємо обробники подій для нового файлу
                addItemEventListeners(fileElement, fileId, 'file');

                filesGrid.appendChild(fileElement);
                fileCounter++;
                
                // Додаємо файл до списку в редакторі
                addFileToProjectList(fileId);
            }

            function addItemEventListeners(element, itemId, type) {
                element.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectItem(element, itemId, type);
                });

                element.addEventListener('dblclick', () => {
                    if (type === 'folder') {
                        openFolder(itemId);
                    } else {
                        openFileInEditor(itemId);
                    }
                });

                element.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    selectItem(element, itemId, type);
                    showContextMenu(e.pageX, e.pageY, type);
                });
            }

            function selectItem(element, itemId, type) {
                // Знімаємо виділення з усіх елементів
                document.querySelectorAll('.file-item').forEach(item => {
                    item.classList.remove('selected');
                });
                // Виділяємо поточний елемент
                element.classList.add('selected');
                selectedItem = { element, id: itemId, type };
            }

            function openFolder(folderId) {
                const folder = folders[folderId];
                if (folder) {
                    currentProject = folderId;
                    
                    // Очищаємо поточний вміст
                    filesGrid.innerHTML = '';
                    
                    // Додаємо файли з папки
                    folder.files.forEach(fileId => {
                        const file = files[fileId];
                        if (file) {
                            filesGrid.appendChild(file.element);
                        }
                    });

                    // Оновлюємо шлях
                    updatePathBar(folder.name);
                    
                    // Оновлюємо список файлів у редакторі
                    updateProjectFilesList();
                }
            }

            function openFileInEditor(fileId) {
                const file = files[fileId];
                if (file) {
                    // Відкриваємо редактор коду
                    openApp('codeEditorWindow', 'Code Editor');
                    
                    // Створюємо або активуємо вкладку для файлу
                    openOrActivateTab(fileId);
                }
            }

            function updatePathBar(folderName) {
                const pathBar = document.querySelector('.path-bar');
                pathBar.innerHTML = `
                    <div class="path-segment">Macintosh HD</div>
                    <div class="path-separator">></div>
                    <div class="path-segment">Files</div>
                    <div class="path-separator">></div>
                    <div class="path-segment">${folderName}</div>
                `;
            }

            function deleteSelectedItem() {
                if (selectedItem) {
                    if (selectedItem.type === 'folder') {
                        delete folders[selectedItem.id];
                    } else {
                        delete files[selectedItem.id];
                        // Видаляємо вкладку якщо вона відкрита
                        closeTab(selectedItem.id);
                    }
                    selectedItem.element.remove();
                    selectedItem = null;
                }
            }

            newFolderBtn.addEventListener('click', () => showNameModal('folder'));
            newFileBtn.addEventListener('click', () => showNameModal('file'));
            deleteFolderBtn.addEventListener('click', deleteSelectedItem);

            confirmNameBtn.addEventListener('click', () => {
                const name = itemNameInput.value.trim();
                if (name) {
                    if (currentModalType === 'folder') {
                        createNewFolder(name);
                    } else {
                        const fileType = fileTypeSelect.value;
                        createNewFile(name, fileType);
                    }
                    nameModal.style.display = 'none';
                }
            });

            cancelNameBtn.addEventListener('click', () => {
                nameModal.style.display = 'none';
            });

            // Закриття модального вікна при кліку на фон
            nameModal.addEventListener('click', (e) => {
                if (e.target === nameModal) {
                    nameModal.style.display = 'none';
                }
            });

            /* -----------------------------
               5. РЕДАКТОР КОДУ - ВИПРАВЛЕННЯ
            ------------------------------ */
            const codeEditor = document.getElementById('codeEditor');
            const previewFrame = document.getElementById('previewFrame');
            const editorTabs = document.getElementById('editorTabs');
            const projectFiles = document.getElementById('projectFiles');
            const runCodeBtn = document.getElementById('runCodeBtn');
            const saveFileBtn = document.getElementById('saveFileBtn');
            const editorNewFileBtn = document.getElementById('editorNewFileBtn');
            const openProjectBtn = document.getElementById('openProjectBtn');

            function openOrActivateTab(fileId) {
                const file = files[fileId];
                if (!file) return;

                // Перевіряємо чи вкладка вже відкрита
                let tab = openTabs.find(t => t.fileId === fileId);
                
                if (!tab) {
                    // Створюємо нову вкладку
                    tab = {
                        fileId: fileId,
                        name: file.name,
                        type: file.type,
                        content: file.content
                    };
                    openTabs.push(tab);
                    
                    // Додаємо вкладку в інтерфейс
                    const tabElement = document.createElement('div');
                    tabElement.className = 'editor-tab';
                    tabElement.setAttribute('data-file-id', fileId);
                    tabElement.innerHTML = `
                        <span>${file.name}</span>
                        <div class="tab-close">×</div>
                    `;
                    
                    tabElement.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('tab-close')) {
                            activateTab(fileId);
                        }
                    });
                    
                    tabElement.querySelector('.tab-close').addEventListener('click', (e) => {
                        e.stopPropagation();
                        closeTab(fileId);
                    });
                    
                    editorTabs.appendChild(tabElement);
                }
                
                activateTab(fileId);
            }

            function activateTab(fileId) {
                const tab = openTabs.find(t => t.fileId === fileId);
                if (!tab) return;

                // Деактивуємо всі вкладки
                document.querySelectorAll('.editor-tab').forEach(tab => {
                    tab.classList.remove('active');
                });

                // Активуємо поточну вкладку
                const tabElement = document.querySelector(`.editor-tab[data-file-id="${fileId}"]`);
                if (tabElement) {
                    tabElement.classList.add('active');
                }

                // Встановлюємо вміст редактора з правильного файлу
                codeEditor.textContent = tab.content;
                activeTab = tab;

                // Оновлюємо попередній перегляд
                updatePreview();
            }

            function closeTab(fileId) {
                const tabIndex = openTabs.findIndex(t => t.fileId === fileId);
                if (tabIndex !== -1) {
                    openTabs.splice(tabIndex, 1);
                }

                const tabElement = document.querySelector(`.editor-tab[data-file-id="${fileId}"]`);
                if (tabElement) {
                    tabElement.remove();
                }

                // Якщо це була активна вкладка, активуємо наступну
                if (activeTab && activeTab.fileId === fileId) {
                    if (openTabs.length > 0) {
                        activateTab(openTabs[0].fileId);
                    } else {
                        codeEditor.textContent = '';
                        activeTab = null;
                        previewFrame.srcdoc = '<html><body><h1>Відкрийте файл для перегляду</h1></body></html>';
                    }
                }
            }

            function updatePreview() {
                if (!activeTab) {
                    previewFrame.srcdoc = '<html><body><h1>Відкрийте файл для перегляду</h1></body></html>';
                    return;
                }

                // Отримуємо всі відкриті файли
                const htmlFile = openTabs.find(t => t.type === 'html');
                const cssFile = openTabs.find(t => t.type === 'css');
                const jsFile = openTabs.find(t => t.type === 'js');

                let htmlContent = htmlFile ? htmlFile.content : '<h1>Відкрийте HTML файл для перегляду</h1>';
                let cssContent = cssFile ? `<style>${cssFile.content}</style>` : '';
                let jsContent = jsFile ? `<script>${jsFile.content}<\/script>` : '';

                // Якщо активний CSS або JS файл, все одно показуємо HTML з підключеними стилями/скриптами
                const fullHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        ${cssContent}
                    </head>
                    <body>
                        ${htmlContent}
                        ${jsContent}
                    </body>
                    </html>
                `;

                previewFrame.srcdoc = fullHtml;
            }

            function saveCurrentFile() {
                if (activeTab) {
                    // Оновлюємо вміст файлу в пам'яті
                    activeTab.content = codeEditor.textContent;
                    files[activeTab.fileId].content = codeEditor.textContent;
                    
                    // Оновлюємо попередній перегляд
                    updatePreview();
                    alert('Файл збережено!');
                }
            }

            function addFileToProjectList(fileId) {
                const file = files[fileId];
                if (!file) return;

                const listItem = document.createElement('li');
                listItem.className = 'file-list-item';
                listItem.setAttribute('data-file-id', fileId);
                listItem.innerHTML = `
                    <div class="file-type-icon ${file.type}-file"></div>
                    <span>${file.name}</span>
                `;

                listItem.addEventListener('click', () => {
                    openOrActivateTab(fileId);
                });

                projectFiles.appendChild(listItem);
            }

            function updateProjectFilesList() {
                projectFiles.innerHTML = '';
                
                if (currentProject) {
                    const folder = folders[currentProject];
                    if (folder) {
                        folder.files.forEach(fileId => {
                            addFileToProjectList(fileId);
                        });
                    }
                }
            }

            // Обробники подій редактора
            codeEditor.addEventListener('input', () => {
                if (activeTab) {
                    activeTab.content = codeEditor.textContent;
                    // Оновлюємо попередній перегляд тільки для HTML файлів
                    if (activeTab.type === 'html') {
                        updatePreview();
                    }
                }
            });

            runCodeBtn.addEventListener('click', () => {
                updatePreview();
                alert('Код виконано! Перевірте консоль браузера.');
            });

            saveFileBtn.addEventListener('click', saveCurrentFile);

            editorNewFileBtn.addEventListener('click', () => {
                showNameModal('file');
            });

            openProjectBtn.addEventListener('click', () => {
                alert('Функція відкриття проекту в розробці');
            });

            /* -----------------------------
               6. КОНТЕКСТНЕ МЕНЮ
            ------------------------------ */
            const contextMenu = document.getElementById('contextMenu');
            const contextNewFolder = document.getElementById('contextNewFolder');
            const contextNewFile = document.getElementById('contextNewFile');
            const contextOpen = document.getElementById('contextOpen');
            const contextDelete = document.getElementById('contextDelete');
            const contextRename = document.getElementById('contextRename');

            function showContextMenu(x, y, type) {
                contextMenu.style.left = x + 'px';
                contextMenu.style.top = y + 'px';
                contextMenu.style.display = 'block';
                
                // Показуємо/ховаємо пункти меню в залежності від типу елементу
                contextOpen.style.display = selectedItem ? 'block' : 'none';
                contextDelete.style.display = selectedItem ? 'block' : 'none';
                contextRename.style.display = selectedItem ? 'block' : 'none';
            }

            function hideContextMenu() {
                contextMenu.style.display = 'none';
            }

            contextNewFolder.addEventListener('click', () => {
                showNameModal('folder');
                hideContextMenu();
            });

            contextNewFile.addEventListener('click', () => {
                showNameModal('file');
                hideContextMenu();
            });

            contextOpen.addEventListener('click', () => {
                if (selectedItem) {
                    if (selectedItem.type === 'folder') {
                        openFolder(selectedItem.id);
                    } else {
                        openFileInEditor(selectedItem.id);
                    }
                }
                hideContextMenu();
            });

            contextDelete.addEventListener('click', () => {
                deleteSelectedItem();
                hideContextMenu();
            });

            contextRename.addEventListener('click', () => {
                if (selectedItem) {
                    const newName = prompt('Введіть нову назву:', 
                        selectedItem.type === 'folder' ? 
                        folders[selectedItem.id].name : 
                        files[selectedItem.id].name.replace(/\.[^/.]+$/, "")
                    );
                    if (newName && newName.trim()) {
                        if (selectedItem.type === 'folder') {
                            folders[selectedItem.id].name = newName.trim();
                        } else {
                            const file = files[selectedItem.id];
                            const extension = file.type === 'html' ? '.html' : file.type === 'css' ? '.css' : '.js';
                            file.name = newName.trim() + extension;
                        }
                        selectedItem.element.querySelector('.file-name').textContent = 
                            selectedItem.type === 'folder' ? newName.trim() : newName.trim() + 
                            (selectedItem.type === 'file' ? (files[selectedItem.id].type === 'html' ? '.html' : 
                            files[selectedItem.id].type === 'css' ? '.css' : '.js') : '');
                    }
                }
                hideContextMenu();
            });

            // Ховаємо контекстне меню при кліку будь-де
            document.addEventListener('click', hideContextMenu);

            // Показуємо контекстне меню для порожньої області
            filesGrid.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.file-item')) {
                    e.preventDefault();
                    selectedItem = null;
                    showContextMenu(e.pageX, e.pageY, 'empty');
                }
            });

            /* -----------------------------
               7. ПЕРЕМІЩЕННЯ ВІКОН
            ------------------------------ */
            document.querySelectorAll('.window-header').forEach(header => {
                header.addEventListener('mousedown', (e) => {
                    if (!e.target.classList.contains('window-control')) {
                        isDragging = true;
                        const window = header.parentElement;
                        dragOffset.x = e.clientX - window.offsetLeft;
                        dragOffset.y = e.clientY - window.offsetTop;
                    }
                });
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const activeWindow = document.querySelector('.app-window[style*="display: flex"]');
                    if (activeWindow) {
                        activeWindow.style.left = (e.clientX - dragOffset.x) + 'px';
                        activeWindow.style.top = (e.clientY - dragOffset.y) + 'px';
                        activeWindow.style.transform = 'none';
                    }
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            /* -----------------------------
               8. ПЛАВНА ПОЯВА ІНТЕРФЕЙСУ
            ------------------------------ */
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 1.2s ease';
                document.body.style.opacity = '1';
            }, 200);

            // Створюємо стартовий проект
            setTimeout(() => {
                const projectFolderId = 'folder_' + Date.now();
                folders[projectFolderId] = {
                    id: projectFolderId,
                    name: 'Мій проект',
                    files: [],
                    type: 'folder'
                };
                
                // Створюємо папку
                createNewFolder('Мій проект');
                currentProject = projectFolderId;
                
                // Створюємо файли
                createNewFile('index', 'html');
                createNewFile('style', 'css');
                createNewFile('script', 'js');
            }, 500);
        });
    </script>
