<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Air 2024 Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхня панель -->
    <header id="menubar">
        <nav class="left-side">
            <span class="apple-logo"></span>
            <span class="app-name">Finder</span>
            <span>Файл</span>
            <span>Редагування</span>
            <span>Вигляд</span>
            <span>Перехід</span>
            <span>Вікно</span>
            <span>Довідка</span>
        </nav>
        <nav class="right-side">
            <span class="icon">🔍</span>
            <span class="icon">📶</span>
            <span class="icon">🔋</span>
            <span class="icon">🔔</span>
            <span class="date-time"></span>
        </nav>
    </header>

    <!-- Робочий стіл -->
    <main id="desktop">
        <div class="desktop-icon" data-name="Macintosh HD">
            <div class="icon-emoji">💽</div>
            <div class="icon-label">Macintosh HD</div>
        </div>
        <div class="desktop-icon" data-name="Documents">
            <div class="icon-emoji">📁</div>
            <div class="icon-label">Documents</div>
        </div>
        <div class="desktop-icon" data-name="Downloads">
            <div class="icon-emoji">⬇️</div>
            <div class="icon-label">Downloads</div>
        </div>
        <div class="desktop-icon" data-name="Trash">
            <div class="icon-emoji">🗑️</div>
            <div class="icon-label">Trash</div>
        </div>
    </main>

    <!-- Dock -->
    <footer id="dock">
        <div class="dock-item" data-name="Finder"><div class="icon-shape finder"></div><div class="dot active"></div></div>
        <div class="dock-item" data-name="Safari"><div class="icon-shape safari"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Mail"><div class="icon-shape mail"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Messages"><div class="icon-shape messages"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Music"><div class="icon-shape music"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Photos"><div class="icon-shape photos"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Calendar"><div class="icon-shape calendar"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Notes"><div class="icon-shape notes"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Settings"><div class="icon-shape settings"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="App Store"><div class="icon-shape appstore"></div><div class="dot"></div></div>
        <div class="dock-item" data-name="Trash"><div class="icon-shape trash"></div><div class="dot"></div></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
