<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Clone (No PNG)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="menubar">
        <nav class="left-side">
            <span class="apple-logo"></span>
            <span class="app-name">Finder</span>
            <span>Файл</span>
            <span>Редагування</span>
            <span>Вигляд</span>
            <span>Перехід</span>
            <span>Вікно</span>
            <span>Довідка</span>
        </nav>
        <nav class="right-side">
            <span class="icon">🔍</span>
            <span class="icon">📶</span>
            <span class="icon">🔋</span>
            <span class="icon">🔔</span>
            <span class="date-time">10:46 Чт 30 Жов</span>
        </nav>
    </header>

    <footer id="dock">
        <div class="dock-item" data-name="Finder">
            <div class="icon-shape finder"></div>
            <div class="dot active"></div>
        </div>
        <div class="dock-item" data-name="Safari">
            <div class="icon-shape safari"></div>
        </div>
        <div class="dock-item" data-name="Пошта">
            <div class="icon-shape mail"></div>
        </div>
        <div class="dock-item" data-name="Музика">
            <div class="icon-shape music"></div>
        </div>
        <div class="dock-item" data-name="Налаштування">
            <div class="icon-shape settings"></div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
